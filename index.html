<!DOCTYPE html>

<button class="mainButton" onclick="closeWelcomeBack()">המשך למשחק</button>

</div>

</div>


<div id="gameContainer">

<div class="logoArea">

<h1>
⚔️ WARDEAL ⚔️
</h1>

</p>

</div>


<input
id="playerName"
type="text"
placeholder="שם שחקן"
maxlength="20"
>


<h3>

</h3>


<div class="sideButtons">


<button
id="policeChoice"
class="sideButton">

👮

<br>

משטרה

כוח החוק
</small>

</button>



<button
id="criminalChoice"
class="sideButton">

<br>

<small>

</small>

</button>


</div>



<button
id="startButton"
class="mainButton">

</button>

<h1>
⚔️ WARDEAL ⚔️

Future Crime & War Strategy
</span>

</div>





<div id="welcomeBox">

ברוכים הבאים ל־WARDEAL

</div>



<div class="gameControls">

<button
class="smallButton"
onclick="exitGame()">

</button>

<button
class="smallButton"
onclick="confirmNewGame(this)">

</button>

<header id="topBar">


<div>

💵

0
</span>

<div>

0

</div>


<div>

💎

0
</span>

</div>


<div>

🖤

<span id="blackMoney">
0
</span>

</div>

⚔️

</div>





<div class="playerInfo">


<h2>

<span id="playerNameDisplay">

שחקן

</span>

</h2>



<p>

צד:

<span id="playerSide">

-

</span>

</p>



</div>








</div>

<div class="statTitle">

<span id="health">
100
</span>

<div class="progress">

</div>

</div>

</div>

<div class="statTitle">

100

</div>

<div class="statTitle">

<div
id="powerBar"
class="progressFill powerFill">

</div>

</div>

</div>

<div class="statTitle">

<span id="units">
0
</span>

<div class="progress">

<div
id="unitsBar"
class="progressFill unitsFill">

</div>

</div>

1
</span>

class="progressFill levelFill">

-
